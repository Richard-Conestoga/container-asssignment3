apiVersion: v1
kind: Service
metadata:
  name: gitea-tunnel-svc
  namespace: default
spec:
  # Standard ClusterIP, will automatically be assigned an IP
  type: ClusterIP
  selector:
    # This selector links this new service to your Gitea pods
    app: gitea 
  ports:
    - name: http
      port: 3000
      targetPort: 3000